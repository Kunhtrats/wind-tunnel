<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WebGL2 Aero Lab</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <canvas id="glcanvas"></canvas>

    <div id="ui-container">
        <div class="header">
            <h3><i class="fas fa-wind"></i> Aero Lab V4</h3>
            <button id="toggleUI" class="icon-btn"><i class="fas fa-minus"></i></button>
        </div>
        
        <div id="controls">
            <div class="control-group">
                <label>Scenarios</label>
                <div class="preset-grid">
                    <button class="preset-btn" data-preset="cruise">Cruise</button>
                    <button class="preset-btn" data-preset="storm">Storm</button>
                    <button class="preset-btn" data-preset="drag">Drag Test</button>
                    <button class="preset-btn" data-preset="jelly">Thick Oil</button>
                </div>
            </div>

            <div class="control-group">
                <label>Obstacle Shape</label>
                <select id="shapeSelect">
                    <option value="0">Cylinder</option>
                    <option value="1">Block</option>
                    <option value="2" selected>Airfoil (Wing)</option>
                    <option value="4">Fighter Jet</option>
                </select>
            </div>

            <div class="control-group">
                <label>Tunnel Floor</label>
                <div class="checkbox-wrapper">
                    <input type="checkbox" id="floorToggle" checked>
                    <span>Enable Ground Effect</span>
                </div>
            </div>

            <div class="control-group">
                <label>Wind Speed <span id="val-wind">1.2</span></label>
                <input type="range" id="windSpeed" min="0" max="3.0" step="0.1" value="1.2">
            </div>

            <div class="control-group">
                <label>Zoom <span id="val-zoom">1.0x</span></label>
                <input type="range" id="zoomSlider" min="0.5" max="3.0" step="0.1" value="1.0">
            </div>

            <div class="control-group">
                <label>Viscosity <span id="val-visc">0.00</span></label>
                <input type="range" id="viscosity" min="0" max="0.2" step="0.001" value="0.0">
            </div>

            <div class="control-group">
                <label>Visuals</label>
                <div class="btn-row">
                    <button id="resetDye"><i class="fas fa-eraser"></i> Clear</button>
                    <button id="toggleColor"><i class="fas fa-palette"></i> Color</button>
                </div>
            </div>

            <div class="control-group">
                <div class="btn-row">
                    <button id="pauseBtn"><i class="fas fa-pause"></i> Pause</button>
                </div>
            </div>

            <div class="info">
                Scroll to Zoom.<br>
                Right Click to drag obstacles.<br>
                Left Click to add smoke.
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
