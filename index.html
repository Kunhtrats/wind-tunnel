<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Wind Tunnel · CFD</title><link rel="stylesheet" href="./style.css"></head>
<body>
<header><h1>Wind Tunnel</h1><span id="status" role="status">init</span></header>
<main>
<aside aria-label="Simulation controls">
<label for="shape">Shape</label><select id="shape"><option value="airfoil">Airfoil</option><option value="venturi">Venturi</option><option value="coanda">Coandă</option><option value="cylinder">Cylinder</option><option value="plate">Plate</option><option value="empty">Empty</option></select>
<p id="experiment"></p>
<label for="speed">Speed <output id="speedValue"></output></label><input id="speed" type="range" min="0" max="0.09" step="0.001" value="0.055">
<label for="viscosity">Viscosity <output id="viscosityValue"></output></label><input id="viscosity" type="range" min="0.02" max="0.12" step="0.005" value="0.04">
<label for="angle">Angle <output id="angleValue"></output></label><input id="angle" type="range" min="-20" max="20" step="1" value="5">
<label for="quality">Resolution</label><select id="quality"><option value="192">192×96</option><option value="288" selected>288×144</option><option value="384">384×192</option><option value="576">576×288</option></select>
<div class="buttons"><button id="pause" aria-pressed="false">Pause</button><button id="reset">Reset</button></div>
<label class="check"><input id="tracers" type="checkbox" checked> Tracers</label>
<details open><summary>Advanced</summary>
<label for="units">Units</label><select id="units"><option value="lattice">lu/ts</option><option value="kmh">km/h</option></select>
<label for="playback">Pace <output id="playbackValue">4×</output></label><input id="playback" type="range" min="1" max="8" step="1" value="4">
<label for="source">Source</label><select id="source"><option value="fan" selected>Fan</option><option value="tunnel">Inlet</option></select>
<label for="fanX">Fan X <output id="fanXValue"></output></label><input id="fanX" type="range" min="0.03" max="0.97" step="0.01" value="0.06">
<label for="fanY">Fan Y <output id="fanYValue"></output></label><input id="fanY" type="range" min="0.08" max="0.92" step="0.01" value="0.5">
<label for="direction">Direction <output id="directionValue"></output></label><input id="direction" type="range" min="-180" max="180" step="1" value="0">
<label for="heat">Heat <output id="heatValue"></output></label><input id="heat" type="range" min="0" max="100" step="5" value="60">
<label for="metres">m/cell</label><input id="metres" type="number" min="0.000001" max="1000" step="any" value="0.01">
<label for="seconds">s/step</label><input id="seconds" type="number" min="0.000001" max="1000" step="any" value="0.0001">
<p id="scaleNote" class="muted"></p>
</details>
<details><summary>Info</summary>
<p class="muted">D2Q9 LBM solver in C++/WASM. Float64. Worker thread. No buoyancy.</p></details>
</aside>
<section class="workspace" aria-label="Wind tunnel">
<nav aria-label="Field view"><button data-view="flow" aria-pressed="true">Flow</button><button data-view="natural" aria-pressed="false">Natural</button><button data-view="temperature" aria-pressed="false">Heat</button><button data-view="pressure" aria-pressed="false">Pressure</button></nav>
<div class="tunnel"><canvas id="canvas" tabindex="0" aria-label="2D fluid field" aria-describedby="probe">Canvas required</canvas></div>
<div class="legend"><span id="legendLabel"></span><span id="legendBar"></span><span id="legendRange"></span></div>
<div class="readouts"><span id="metrics">init</span><output id="probe"></output></div>
<p class="muted" id="viewNote"></p>
</section>
</main><script type="module" src="./main.js"></script>
</body></html>
