<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Wind Tunnel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="canvas-container"></div>

    <div id="ui-panel">
        <div class="panel-header">
            <div class="panel-title">
                <i class="fas fa-wind"></i>
                Vapor Flow 3D
            </div>
            <button class="toggle-btn" id="togglePanel">
                <i class="fas fa-chevron-up"></i>
            </button>
        </div>
        
        <div id="panel-content">
            <div class="control-section">
                <div class="control-label">
                    <span>Flow Speed</span>
                    <span class="control-value" id="speedValue">100 km/h</span>
                </div>
                <input type="range" id="windSpeed" min="0" max="350" step="10" value="100">
            </div>

            <div class="control-section">
                <div class="control-label">
                    <span>Obstacle</span>
                </div>
                <select id="shapeSelect">
                    <option value="wing" selected>Aerodynamic Wing</option>
                    <option value="sphere">Sphere</option>
                    <option value="cube">Cube</option>
                    <option value="car">Low Poly Car</option>
                </select>
            </div>

            <div class="control-section">
                <div class="control-label">
                    <span>Smoke Density</span>
                    <span class="control-value" id="countValue">8000</span>
                </div>
                <input type="range" id="particleCount" min="2000" max="15000" step="1000" value="8000">
            </div>

            <div class="divider"></div>

            <div class="control-section">
                <div class="checkbox-control">
                    <input type="checkbox" id="rotateToggle">
                    <label for="rotateToggle">Auto-Rotate View</label>
                </div>
            </div>

            <div class="control-section">
                <div class="button-group">
                    <button id="resetCam">
                        <i class="fas fa-camera"></i> Reset
                    </button>
                    <button id="pauseBtn">
                        <i class="fas fa-pause"></i> Pause
                    </button>
                </div>
            </div>

            <div class="info-box">
                <strong>Visuals:</strong><br>
                High-speed "Vapor Cone" rendering enabled.<br>
                <span style="color: #4fc3f7">Use scroll to zoom inside the smoke.</span>
            </div>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
